  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --bg: #FFFAF5;
      --bg-warm: #FFF4EA;
      --bg-card: #FFFFFF;
      --sogan: #B8521B;
      --sogan-rgb: 184, 82, 27;
      --sogan-dark: #7C2D12;
      --sogan-tint: #FEF2E8;
      --amber: #D97706;
      --amber-rgb: 217, 119, 6;
      --amber-text: #92400E;
      --cyan: #0284C7;
      --cyan-rgb: 2, 132, 199;
      --cyan-dark: #075985;
      --cyan-tint: #E0F2FE;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #475569;
      --border: #E2D9CF;
      --border-light: #EFE8DF;
      --shadow-color: 24, 18, 12;
      --font-display: 'Outfit', system-ui, sans-serif;
      --font-body: 'Nunito', system-ui, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; height: 100%; }
    
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background-color: #C26D38;
      color: #FFFFFF;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }

    :focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ===== HEADER ===== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 250, 245, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .brand svg { flex-shrink: 0; }
    .brand-accent { color: var(--sogan); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .nav-link {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-secondary);
      transition: color 0.2s ease;
    }
    .nav-link:hover { color: var(--sogan); }

    /* ===== MAIN CONTENT 404 ===== */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      position: relative;
      overflow: hidden;
    }

    .error-card {
      max-width: 580px;
      width: 100%;
      text-align: center;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: clamp(32px, 5vw, 48px) clamp(24px, 4vw, 40px);
      box-shadow: 0 4px 20px rgba(var(--shadow-color), 0.06), 0 1px 3px rgba(var(--shadow-color), 0.04);
      position: relative;
      z-index: 1;
    }

    .error-code {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 8vw, 5rem);
      font-weight: 800;
      color: var(--sogan);
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .canvas-container {
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      position: relative;
    }
    .canvas-container svg {
      width: 100%;
      height: 100%;
      animation: floatRotate 20s linear infinite;
    }

    @keyframes floatRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .canvas-container svg {
        animation: none;
      }
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3.5vw, 1.85rem);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--text-secondary);
      font-size: 1.02rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 26px;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      background: var(--sogan);
      color: #fff;
      box-shadow: 0 4px 14px rgba(var(--sogan-rgb), 0.3);
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }
    .btn-primary:hover {
      background: var(--sogan-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(var(--sogan-rgb), 0.4);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-primary);
      border: 1.5px solid var(--border);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .btn-ghost:hover {
      background: var(--bg-warm);
      border-color: var(--sogan);
      color: var(--sogan-dark);
    }

    /* ===== FOOTER ===== */
    .site-footer {
      background: var(--bg-warm);
      border-top: 1px solid var(--border-light);
      padding: 24px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .site-footer a {
      color: var(--sogan);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
